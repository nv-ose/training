project:
  type: website
  output-dir: docs
  # Explicit list, so stray .qmd/.md files (README.md, _template/) are not rendered
  render:
    - index.qmd
    - "pages/**/*.qmd"
  resources:
    - "/.nojekyll"
    - "pages/intro-to-github/README-template.md"
    - "practice/positron-practice.zip"

website:
  title: "NV OSE Training"
  description: "Workshops, tutorials, and learning materials from the Nevada Office of State Epidemiology"
  site-url: https://nv-ose.github.io/training/
  repo-url: https://github.com/nv-ose/training
  search: true
  page-navigation: true
  navbar:
    logo: images/logo.png
    logo-alt: "Office of State Epidemiology logo"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Intro to Git & GitHub"
        href: pages/intro-to-github/index.qmd
      - text: "Intro to Quarto"
        href: pages/intro-to-quarto/index.qmd
      - text: "Intro to Positron"
        href: pages/intro-to-positron/index.qmd
    right:
      - text: "Feedback"
        icon: envelope
        href: "mailto:mwegener@health.nv.gov?subject=NV%20OSE%20Training%20feedback"
      - icon: github
        href: https://github.com/nv-ose/training
        aria-label: "Training materials on GitHub"
  sidebar:
    - id: intro-to-github
      title: "Intro to Git & GitHub"
      style: docked
      contents:
        - href: pages/intro-to-github/index.qmd
          text: "Overview"
        - section: "Lessons"
          contents:
            - pages/intro-to-github/01-git-vs-github.qmd
            - pages/intro-to-github/02-setup.qmd
            - pages/intro-to-github/03-repositories-readme-gitignore.qmd
            - pages/intro-to-github/04-github-desktop.qmd
            - pages/intro-to-github/05-command-line.qmd
            - pages/intro-to-github/06-branches-pull-requests.qmd
            - pages/intro-to-github/07-clones-forks.qmd
            - pages/intro-to-github/08-public-vs-private.qmd
            - pages/intro-to-github/09-data-security.qmd
        - section: "Practice and reference"
          contents:
            - pages/intro-to-github/exercises.qmd
            - pages/intro-to-github/readme-guide.qmd
            - pages/intro-to-github/cheatsheet.qmd
            - pages/intro-to-github/glossary.qmd
            - pages/intro-to-github/resources.qmd
    - id: intro-to-quarto
      title: "Introduction to Quarto"
      style: docked
      contents:
        - href: pages/intro-to-quarto/index.qmd
          text: "Overview"
        - section: "Session 1: Markdown and Quarto basics"
          contents:
            - pages/intro-to-quarto/01-what-is-quarto.qmd
            - pages/intro-to-quarto/02-setup.qmd
            - pages/intro-to-quarto/03-markdown.qmd
            - pages/intro-to-quarto/04-quarto-markdown.qmd
            - pages/intro-to-quarto/05-code.qmd
        - section: "Session 2: Documents and presentations"
          contents:
            - pages/intro-to-quarto/06-documents.qmd
            - pages/intro-to-quarto/07-presentations.qmd
        - section: "Session 3: Websites and publishing"
          contents:
            - pages/intro-to-quarto/08-websites.qmd
            - pages/intro-to-quarto/09-preview-render.qmd
            - pages/intro-to-quarto/10-customize.qmd
            - pages/intro-to-quarto/11-publish-github-pages.qmd
            - pages/intro-to-quarto/12-add-to-nv-ose-site.qmd
        - section: "Practice and reference"
          contents:
            - pages/intro-to-quarto/exercises.qmd
            - pages/intro-to-quarto/cheatsheet.qmd
            - pages/intro-to-quarto/resources.qmd
    - id: intro-to-positron
      title: "Introduction to Positron"
      style: docked
      contents:
        - href: pages/intro-to-positron/index.qmd
          text: "Overview"
        - section: "Lessons"
          contents:
            - pages/intro-to-positron/01-introduction.qmd
            - pages/intro-to-positron/02-setup.qmd
            - pages/intro-to-positron/03-projects.qmd
            - pages/intro-to-positron/04-files-folders.qmd
            - pages/intro-to-positron/05-panes.qmd
            - pages/intro-to-positron/06-extensions.qmd
            - pages/intro-to-positron/07-git.qmd
            - pages/intro-to-positron/08-python-environments.qmd
        - section: "Practice"
          contents:
            - pages/intro-to-positron/practice-project.qmd
        - section: "Reference"
          contents:
            - pages/intro-to-positron/quick-reference.qmd
            - pages/intro-to-positron/troubleshooting.qmd
  page-footer:
    left: "Nevada Office of State Epidemiology"
    center: "Questions or feedback? Email [mwegener@health.nv.gov](mailto:mwegener@health.nv.gov?subject=NV%20OSE%20Training%20feedback)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
